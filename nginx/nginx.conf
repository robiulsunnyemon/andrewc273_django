# -------------------------
# HTTP → HTTPS redirect
# -------------------------
server {
    listen 80;
    server_name admin.dojapr.com;

    # Let's Encrypt ACME (keep for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------
# HTTPS SERVER
# -------------------------
server {
    listen 443 ssl;
    server_name admin.dojapr.com;

    # SSL CERTS (now valid)
    ssl_certificate /etc/letsencrypt/live/admin.dojapr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.dojapr.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_ecdh_curve secp384r1;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 20m;

    # -------------------------
    # STATIC FILES
    # -------------------------
    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # -------------------------
    # MEDIA FILES
    # -------------------------
    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }

    # -------------------------
    # WEBSOCKET (Daphne)
    # -------------------------
    location /ws/ {
        proxy_pass http://daphne:9000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    # -------------------------
    # DJANGO (Gunicorn)
    # -------------------------
    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }
}