server {
    listen 80;
    server_name admin.dojapr.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.dojapr.com;

    ssl_certificate /etc/letsencrypt/live/admin.dojapr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.dojapr.com/privkey.pem;

    client_max_body_size 20m;

    location /static/ {
        alias /staticfiles/;
        access_log off;
    }

    location /media/ {
        alias /media/;
        access_log off;
    }

    location = / {
        return 301 https://$host/admin/;
    }

    location /ws/ {
        proxy_pass http://daphne:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}