name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /root/andrewc273_django

            echo "📥 Updating code from GitHub..."
            git fetch --all
            git reset --hard origin/main
            git clean -fd

            echo "🔧 Ensuring directories..."
            mkdir -p certbot/conf certbot/www

            # যদি কোনো সার্টিফিকেট ফোল্ডার না থাকে (একেবারে নতুন সার্ভার)
            if [ ! -d "./certbot/conf/live/admin.dojapr.com" ]; then
              echo "🔐 Creating dummy certificate to allow Nginx to start..."
              mkdir -p ./certbot/conf/live/admin.dojapr.com
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout ./certbot/conf/live/admin.dojapr.com/privkey.pem \
                -out ./certbot/conf/live/admin.dojapr.com/fullchain.pem \
                -subj '/CN=localhost'
            fi

            echo "🐳 Building and starting containers..."
            # --build নিশ্চিত করবে নতুন কোড আপডেট হয়েছে
            docker-compose up -d --build

            echo "⏳ Waiting for Nginx to stabilize..."
            sleep 10

            echo "📜 Requesting/Renewing real certificate..."
            # --keep-until-expiring দিলে মেয়াদ থাকলে রিকোয়েস্ট করবে না, ফলে রেট লিমিট খাবেন না
            docker-compose run --rm certbot certonly --webroot --webroot-path=/var/www/certbot \
              --noninteractive --agree-tos --no-eff-email \
              --email "${{ secrets.CERTBOT_EMAIL }}" \
              -d "admin.dojapr.com" --keep-until-expiring

            echo "♻️ Reloading nginx with the real certificate..."
            docker-compose exec -T nginx nginx -s reload

            echo "📦 Running migrations..."
            docker-compose exec -T web python manage.py migrate

            echo "📦 Collecting static files..."
            docker-compose exec -T web python manage.py collectstatic --noinput

            echo "🎉 Deployment completed successfully!"