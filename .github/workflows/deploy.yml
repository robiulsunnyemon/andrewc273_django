name: Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            # Project directory
            cd /root/andrewc273_django

            # Ensure server code matches main branch exactly
            git fetch --all
            git reset --hard origin/main

            # Rebuild docker images without cache
            docker compose build --no-cache

            # Ensure static folder exists to avoid warnings
            mkdir -p ./static

            # Apply migrations inside the running web container
            docker compose run --rm web python manage.py migrate

            # Collect static files
            docker compose run --rm web python manage.py collectstatic --noinput

            # Restart containers
            docker compose up -d

            # Optional: check migrations applied
            docker compose run --rm web python manage.py showmigrations
