services:
  web:
    build: .
    command: gunicorn projects.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - sqlite_data:/data
    environment:
      - SQLITE_PATH=/data/db.sqlite3
    depends_on:
      - redis
  daphne:
    build: .
    command: daphne -b 0.0.0.0 -p 9000 projects.asgi:application
    env_file: .env
    volumes:
      - media:/app/media
      - sqlite_data:/data
    environment:
      - SQLITE_PATH=/data/db.sqlite3
    depends_on:
      - redis
  redis:
    image: redis:7.2-alpine
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro
      - media:/media:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - daphne
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: ["certbot"]

volumes:
  staticfiles:
  media:
  sqlite_data:
